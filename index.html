<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>每日早报</title>
<style>
  :root{
    --bg:#0f1116; --card:#171a21; --line:#242935; --fg:#eceff5; --dim:#98a1b3;
    --accent:#7aa2ff; --hot:#ff8f6b; --green:#5ed6a4; --gold:#e8c07d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -200px,#1b2438 0%,var(--bg) 55%) no-repeat,var(--bg);
    color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px;margin:0 auto;padding:26px 18px 48px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  h1{margin:0;font-size:26px;font-weight:650;letter-spacing:.5px}
  h1 small{display:block;font-size:13px;font-weight:400;color:var(--dim);letter-spacing:1px;margin-top:2px}
  .stamp{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}

  .weather{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--dim)}
  .chip b{color:var(--fg);font-weight:600;font-size:14px}

  .hero{position:relative;border-radius:18px;overflow:hidden;margin:0 0 22px;background:#0b0d12;border:1px solid var(--line)}
  .hero img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;opacity:.92}
  .hero .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 12px;font-size:12px;color:#e8ecf5;
    background:linear-gradient(transparent,rgba(5,7,11,.82))}

  section{margin-bottom:26px}
  .sec-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;color:var(--dim);letter-spacing:2px}
  .sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;
    transition:border-color .15s ease,transform .06s ease}
  .item:active{transform:scale(.995)}
  .item a{color:inherit;text-decoration:none}
  .item .top{display:flex;gap:10px;align-items:flex-start}
  .rank{flex:0 0 auto;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
    font-size:12px;font-weight:700;background:#212736;color:var(--dim);margin-top:2px}
  .item.hot .rank{background:rgba(255,143,107,.14);color:var(--hot)}
  .item.growth .rank{background:rgba(94,214,164,.14);color:var(--green)}
  .t{font-size:16px;font-weight:600;line-height:1.4;word-break:break-word}
  .why{color:var(--dim);font-size:13.5px;margin-top:6px;padding-left:32px}
  .why::before{content:"↳ ";color:#4a5468}

  blockquote{margin:0;padding:18px 18px 18px 20px;border-left:2px solid var(--gold);
    background:linear-gradient(90deg,rgba(232,192,125,.07),transparent);border-radius:0 12px 12px 0;
    font-family:Georgia,"Songti SC","Source Han Serif SC",serif;font-size:16.5px;line-height:1.7;color:#f0e6d6}
  blockquote .who{display:block;margin-top:8px;font-family:-apple-system,sans-serif;font-size:12px;color:var(--dim)}

  .history summary{cursor:pointer;color:var(--dim);font-size:13px;padding:10px 0;list-style:none}
  .history summary::-webkit-details-marker{display:none}
  .history summary::before{content:"▸ ";color:var(--accent)}
  .history details[open] summary::before{content:"▾ "}
  .h-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim)}
  .h-item b{color:var(--fg);font-weight:500}
  .h-item a{color:var(--accent);text-decoration:none;font-size:12px}

  .empty{color:var(--dim);font-size:14px;padding:16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
  footer{margin-top:30px;color:#5c6678;font-size:12px;text-align:center;line-height:1.9}
  .install{display:none;margin-left:10px;padding:6px 10px;border-radius:9px;border:1px solid var(--accent);
    background:transparent;color:var(--accent);font-size:12px}
  .install.show{display:inline-block}
  @media (prefers-reduced-motion:no-preference){
    .item{animation:in .25s ease both}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">每日早报<small id="sub">正在加载…</small></h1>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="weather" id="weather"></div>

  <div class="hero" id="hero" hidden>
    <img id="heroImg" alt="今日图片" loading="lazy">
    <div class="cap" id="heroCap"></div>
  </div>

  <section id="hotSec">
    <div class="sec-title">🔥 值得看一眼</div>
    <div id="hot"></div>
  </section>

  <section id="growthSec">
    <div class="sec-title">🌱 慢一点的东西</div>
    <div id="growth"></div>
  </section>

  <section id="quoteSec" hidden>
    <blockquote id="quote"></blockquote>
  </section>

  <section class="history">
    <details id="histBox">
      <summary>往期早报</summary>
      <div id="hist"></div>
    </details>
  </section>

  <footer>
    每天 07:30 自动生成 · 数据来自 B站热榜 / Hacker News / 阮一峰周刊 / 少数派 / Bing 每日图<br>
    <span id="gen"></span>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };

  function itemHtml(it, i, kind) {
    return '<div class="item ' + kind + '"><a href="' + esc(it.url || '#') + '" target="_blank" rel="noopener">' +
      '<div class="top"><div class="rank">' + (i + 1) + '</div><div class="t">' + esc(it.title) + '</div></div>' +
      (it.why ? '<div class="why">' + esc(it.why) + '</div>' : '') +
      '</a></div>';
  }

  function paint(brief) {
    if (!brief) {
      $('sub').textContent = '还没有数据';
      $('hot').innerHTML = '<div class="empty">今天的早报还没生成。第一次运行需要先在 GitHub 上手动触发一次 Actions。</div>';
      $('growthSec').hidden = true;
      return;
    }
    var d = brief.date || '';
    $('title').childNodes[0].nodeValue = '早报';
    $('sub').textContent = d + (brief.weather ? ' · ' + brief.weather.city : '');
    $('stamp').innerHTML = (brief.generated_at || '').slice(11, 16) + '<br>生成';

    var w = brief.weather;
    $('weather').innerHTML = w ? [
      '<span class="chip"><b>' + esc(w.desc) + '</b></span>',
      '<span class="chip">' + w.tmin + '° ~ <b>' + w.tmax + '°</b></span>',
      '<span class="chip">降水 ' + (w.rain || 0) + '%</span>',
      '<span class="chip">' + esc(w.city) + '</span>'
    ].join('') : '<span class="chip">天气取不到</span>';

    var img = brief.image;
    if (img && img.url) {
      $('hero').hidden = false;
      $('heroImg').src = img.url;
      $('heroCap').textContent = img.copyright || img.title || '';
    } else { $('hero').hidden = true; }

    var hot = brief.hot || [];
    $('hot').innerHTML = hot.length ? hot.map(function (x, i) { return itemHtml(x, i, 'hot'); }).join('')
      : '<div class="empty">今天没抓到合适的热点。</div>';

    var growth = brief.growth || [];
    $('growthSec').hidden = !growth.length;
    $('growth').innerHTML = growth.map(function (x, i) { return itemHtml(x, i, 'growth'); }).join('');

    if (brief.closing) {
      $('quoteSec').hidden = false;
      $('quote').innerHTML = esc(brief.closing) + '<span class="who">一句话</span>';
    } else { $('quoteSec').hidden = true; }

    $('gen').textContent = '本页数据：' + (brief.generated_at || '').replace('T', ' ');
  }

  function paintHistory(list) {
    if (!list || !list.length) { $('histBox').hidden = true; return; }
    $('hist').innerHTML = list.slice().reverse().map(function (h) {
      var first = (h.hot && h.hot[0]) ? h.hot[0] : null;
      return '<div class="h-item">' + esc(h.date) + ' · ' + (first
        ? '<b>' + esc(first.title) + '</b> <a href="' + esc(first.url) + '" target="_blank" rel="noopener">打开</a>'
        : '无内容') + '</div>';
    }).join('');
  }

  fetch('data.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (b) { paint(b); })
    .catch(function () { paint(null); });

  fetch('history.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : []; })
    .then(paintHistory).catch(function () { $('histBox').hidden = true; });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
