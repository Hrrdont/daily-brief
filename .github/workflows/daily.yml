name: daily brief

on:
  schedule:
    # 06:30 Asia/Shanghai == 22:30 UTC (previous day).
    # GitHub's scheduler has been late by 1-2 hours lately, so we aim early.
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the brief
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_MODEL: ${{ vars.GH_MODELS_MODEL }}
          BRIEF_CITY: ${{ vars.BRIEF_CITY }}
        run: python fetch_brief.py

      - name: Commit data
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json history.json
          if git diff --quiet --cached; then
            echo "no changes"
          else
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            git push
          fi
